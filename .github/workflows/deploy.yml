name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys landing on one box at once corrupts node_modules mid-install.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Update and reload
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Cheap guard: never ship a file the server cannot parse.
      - name: Syntax check
        run: |
          node --check server.js
          node --check auth.js
          node --check config.js
          node --check ecosystem.config.js
          bash -n deploy.sh
          bash -n deploy-remote.sh
          bash -n scripts/vps-deploy.sh

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # The VPS is itself a git clone that people commit from, so the deploy
      # updates it with git rather than overwriting files underneath it.
      # vps-deploy.sh is piped in over stdin, so it is never the file it is
      # updating. It stashes any uncommitted server-side work before resetting.
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "VPS_PATH='$VPS_PATH' SHA='${{ github.sha }}' bash -s" < scripts/vps-deploy.sh
