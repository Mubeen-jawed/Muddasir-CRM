# =============================================
# Nginx reverse proxy for Budget Dashboard
# =============================================
# Save this to: /etc/nginx/sites-available/budget-dashboard
# Then:
#   sudo ln -s /etc/nginx/sites-available/budget-dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# For SSL (recommended):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d budget.yourdomain.com

server {
    listen 80;
    server_name budget.yourdomain.com;  # Change this to your domain/subdomain

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
