<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Budget Pacing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0a0a0a;color:#e8e8e8;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(16px,5vw,24px);
  padding-left:calc(clamp(16px,5vw,24px) + env(safe-area-inset-left,0px));
  padding-right:calc(clamp(16px,5vw,24px) + env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
.card{
  width:100%;max-width:360px;background:#141414;
  border:1px solid rgba(255,255,255,0.08);border-radius:14px;
  padding:clamp(24px,6vw,32px) clamp(20px,5vw,28px);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
h1{font-size:20px;font-weight:700;letter-spacing:-0.4px;color:#fff}
.sub{font-size:13px;color:#666;margin-top:6px;margin-bottom:24px}
label{display:block;font-size:12px;color:#999;margin-bottom:6px;font-weight:500}
.field{margin-bottom:16px}
input{
  width:100%;padding:10px 12px;border-radius:8px;
  border:1px solid rgba(255,255,255,0.15);background:#0f0f0f;
  color:#e8e8e8;font-size:16px;font-family:inherit;transition:border-color 0.15s;
}
input:focus{outline:none;border-color:#2a78d6}
input:disabled{opacity:0.5;cursor:not-allowed}
.btn{
  width:100%;padding:11px;border-radius:8px;border:1px solid #2a78d6;
  background:#2a78d6;color:#fff;font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:all 0.15s;margin-top:4px;
}
.btn:hover:not(:disabled){background:#2569bb;border-color:#2569bb}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.msg{
  font-size:13px;border-radius:8px;padding:10px 12px;margin-bottom:16px;
  display:none;line-height:1.45;
}
.msg.error{display:block;background:rgba(227,73,72,0.12);border:1px solid rgba(227,73,72,0.35);color:#ff9a99}
.foot{margin-top:20px;font-size:11px;color:#444;text-align:center;line-height:1.5}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:0.01ms !important;animation-duration:0.01ms !important}
}
</style>
</head>
<body>

<div class="card">
  <h1>Budget pacing</h1>
  <div class="sub">Sign in to view the dashboard.</div>

  <div class="msg" id="msg" role="alert" aria-live="polite"></div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">Sign in</button>
  </form>

  <div class="foot">Sessions last 12 hours.</div>
</div>

<script>
const form = document.getElementById('loginForm');
const msgEl = document.getElementById('msg');
const btn = document.getElementById('submitBtn');
const userEl = document.getElementById('username');
const passEl = document.getElementById('password');

function showError(text) {
  msgEl.className = 'msg error';
  msgEl.textContent = text;
}

function setBusy(busy) {
  btn.disabled = busy;
  userEl.disabled = busy;
  passEl.disabled = busy;
  btn.textContent = busy ? 'Signing in…' : 'Sign in';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgEl.className = 'msg';
  setBusy(true);

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: userEl.value,
        password: passEl.value,
      }),
    });

    if (res.ok) {
      // Full navigation, not fetch — we want the browser to send the new cookie.
      window.location.replace('/');
      return;
    }

    const body = await res.json().catch(() => ({}));
    showError(body.error || 'Sign in failed. Please try again.');
    passEl.value = '';

    // A lockout leaves the form disabled until it lifts, so retrying is pointless.
    if (res.status === 429) {
      setBusy(true);
      btn.textContent = 'Locked out';
      return;
    }
    setBusy(false);
    passEl.focus();
  } catch (err) {
    showError('Cannot reach the server. Check your connection and try again.');
    setBusy(false);
  }
});
</script>

</body>
</html>
