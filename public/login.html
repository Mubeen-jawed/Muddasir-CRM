<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<script>
// Theme: 'light' (white + blue) or 'dark' (black + blue). Saved per browser; defaults to the OS setting.
(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Ben ADU Dashboard</title>
<style>
:root{--danger:#dc2626;--bg:#ffffff;--panel:#ffffff;--line:#dfe3e8;--text:#0b1220;--text-strong:#0b1220;--muted:#5b6674;--faint:#8b95a3;--accent:#1a56db;--accent-strong:#123e9e;--accent-soft:rgba(26,86,219,0.10);--input-bg:#ffffff;color-scheme:light}
:root[data-theme="dark"]{--danger:#ef4444;--bg:#000000;--panel:#0a0a0a;--line:#1f2733;--text:#e6e9ee;--text-strong:#ffffff;--muted:#9aa4b2;--faint:#5f6977;--accent:#3b82f6;--accent-strong:#7fb0ff;--accent-soft:rgba(59,130,246,0.16);--input-bg:#0a0a0a;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(16px,5vw,24px);
  padding-left:calc(clamp(16px,5vw,24px) + env(safe-area-inset-left,0px));
  padding-right:calc(clamp(16px,5vw,24px) + env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
.card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:clamp(24px,6vw,32px) clamp(20px,5vw,28px)}
h1{font-size:20px;font-weight:700;letter-spacing:-0.4px;color:var(--text-strong)}
.sub{font-size:13px;color:var(--muted);margin-top:6px;margin-bottom:24px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field{margin-bottom:16px}
input{width:100%;padding:10px 12px;border-radius:4px;border:1px solid var(--line);background:var(--input-bg);color:var(--text);font-size:16px;font-family:inherit;transition:border-color 0.15s}
input:focus{outline:none;border-color:var(--accent)}
input:disabled{opacity:0.5;cursor:not-allowed}
.btn{width:100%;padding:11px;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.15s;margin-top:4px}
.btn:hover:not(:disabled){background:var(--accent-strong);border-color:var(--accent-strong)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.msg{font-size:13px;border-radius:3px;padding:10px 12px;margin-bottom:16px;display:none;line-height:1.45}
.msg.error{display:block;color:var(--danger);padding:0 0 4px}
.foot{margin-top:20px;font-size:11px;color:var(--faint);text-align:center;line-height:1.5}
@media(prefers-reduced-motion:reduce){*{transition-duration:0.01ms !important;animation-duration:0.01ms !important}}
</style>
</head>
<body>

<div class="card">
  <h1>Ben ADU dashboard</h1>
  <div class="sub">Sign in to view the dashboard.</div>

  <div class="msg" id="msg" role="alert" aria-live="polite"></div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">Sign in</button>
  </form>

  <div class="foot">Sessions last 12 hours.</div>
</div>

<script>
const form = document.getElementById('loginForm');
const msgEl = document.getElementById('msg');
const btn = document.getElementById('submitBtn');
const userEl = document.getElementById('username');
const passEl = document.getElementById('password');

function showError(text) {
  msgEl.className = 'msg error';
  msgEl.textContent = text;
}

function setBusy(busy) {
  btn.disabled = busy;
  userEl.disabled = busy;
  passEl.disabled = busy;
  btn.textContent = busy ? 'Signing in…' : 'Sign in';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgEl.className = 'msg';
  setBusy(true);

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: userEl.value,
        password: passEl.value,
      }),
    });

    if (res.ok) {
      // Full navigation, not fetch — we want the browser to send the new cookie.
      window.location.replace('/');
      return;
    }

    const body = await res.json().catch(() => ({}));
    showError(body.error || 'Sign in failed. Please try again.');
    passEl.value = '';

    // A lockout leaves the form disabled until it lifts, so retrying is pointless.
    if (res.status === 429) {
      setBusy(true);
      btn.textContent = 'Locked out';
      return;
    }
    setBusy(false);
    passEl.focus();
  } catch (err) {
    showError('Cannot reach the server. Check your connection and try again.');
    setBusy(false);
  }
});
</script>

</body>
</html>
